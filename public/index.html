@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

:root {
  /* — Brand Palette — */
  --ts-bg:           #F5F0EB;   /* warm cream background       */
  --ts-surface:      #FFFFFF;   /* card / panel surface         */
  --ts-surface-alt:  #EDE8E3;   /* subtle secondary surface     */
  --ts-charcoal:     #3D3835;   /* primary text — charcoal      */
  --ts-charcoal-soft:#6B6560;   /* secondary text — soft char   */
  --ts-muted:        #A09890;   /* placeholder / disabled       */
  --ts-border:       #E0D8D0;   /* borders / dividers           */
  --ts-purple:       #8B7DA8;   /* accent purple — calm         */
  --ts-purple-soft:  #B8AFCA;   /* light purple tint            */
  --ts-pink:         #C4A6B0;   /* accent pink — warm           */
  --ts-pink-soft:    #E8D5DD;   /* light pink tint              */
  --ts-green:        #7BAE98;   /* correct / success            */
  --ts-amber:        #D4A76A;   /* warning / hint               */
  --ts-red-soft:     #D4908A;   /* wrong / reset                */

  /* — Semantic Aliases — */
  --ts-background:          #F5F0EB;
  --ts-foreground:          #3D3835;
  --ts-card:                rgba(255, 255, 255, 0.72);
  --ts-card-foreground:    #3D3835;
  --ts-popover:             rgba(255, 255, 255, 0.88);
  --ts-popover-foreground:  #3D3835;
  --ts-primary:            #8B7DA8;
  --ts-primary-foreground: #FFFFFF;
  --ts-muted:               #A09890;
  --ts-muted-foreground:    #6B6560;
  --ts-border:              #E0D8D0;
  --ts-input:               #EDE8E3;
  --ts-ring:                #8B7DA8;

  /* — Radius — */
  --ts-radius-sm:   8px;
  --ts-radius-md:  16px;
  --ts-radius-lg:  24px;
  --ts-radius-xl:  32px;

  /* — Shadows — */
  --ts-shadow-sm:  0 2px 8px rgba(61, 56, 53, 0.06);
  --ts-shadow-md:  0 8px 32px rgba(61, 56, 53, 0.08);
  --ts-shadow-lg:  0 16px 48px rgba(61, 56, 53, 0.12);
  --ts-glow-purple: 0 0 40px rgba(139, 125, 168, 0.15);
  --ts-glow-pink:   0 0 40px rgba(196, 166, 176, 0.12);

  /* — Typography — */
  --ts-font-sans:  'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --ts-font-mono:  'SF Mono', 'Fira Code', monospace;

  /* — Transitions — */
  --ts-ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ts-duration:    320ms;
}

      /* Pulse glow animation for CTA button */
      @keyframes glowPulse {
        0%, 100% {
          box-shadow: 0 0 20px rgba(139, 125, 168, 0.25), 0 4px 16px rgba(139, 125, 168, 0.2);
        }
        50% {
          box-shadow: 0 0 40px rgba(139, 125, 168, 0.45), 0 4px 24px rgba(196, 166, 176, 0.3);
        }
      }
      .cta-pulse {
        animation: glowPulse 2.4s ease-in-out infinite;
      }

      /* Fade-in on load */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeInUp 0.6s var(--ts-ease-out) both;
      }
      .fade-in-d1 { animation-delay: 0.08s; }
      .fade-in-d2 { animation-delay: 0.16s; }
      .fade-in-d3 { animation-delay: 0.24s; }
      .fade-in-d4 { animation-delay: 0.32s; }
      .fade-in-d5 { animation-delay: 0.40s; }

      /* Sidebar active indicator */
      .sidebar-item {
        position: relative;
        transition: all 0.3s ease-out;
      }
      .sidebar-item::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 0;
        background: var(--ts-purple);
        border-radius: 0 4px 4px 0;
        transition: height 0.3s ease-out;
      }
      .sidebar-item.active::before {
        height: 60%;
      }
      .sidebar-item.active {
        color: #fff;
        background: rgba(139, 125, 168, 0.15);
      }
      .sidebar-item:hover {
        background: rgba(255, 255, 255, 0.06);
        transform: scale(1.02);
      }

      /* Mobile drawer */
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(61, 56, 53, 0.4);
        backdrop-filter: blur(4px);
        z-index: 40;
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }
      .sidebar-overlay.open {
        display: block;
        opacity: 1;
      }
      .sidebar-drawer {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 260px;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .sidebar-drawer.open {
        transform: translateX(0);
      }

      /* Glass card base */
      .glass-card {
        backdrop-filter: blur(20px);

        box-shadow: 0 12px 40px rgba(61, 56, 53, 0.12);

<body class="min-h-screen font-sans antialiased">
<main class="flex min-h-screen">

  <!-- ========== MOBILE SIDEBAR OVERLAY ========== -->

  <!-- ========== SIDEBAR (Desktop: fixed narrow | Mobile: drawer) ========== -->
  <aside id="sidebarDrawer"
    class="sidebar-drawer md:fixed md:left-0 md:top-0 md:bottom-0 md:w-[72px] md:transform-none md:z-30

  >
    <!-- Logo -->

        <span class="md:hidden">匹配大厅</span>
      </a>
      <a href="#" class="sidebar-item flex items-center gap-3 px-3 py-3 rounded-xl text-sm tracking-tight text-white/60">
        <i data-lucide="history" class="w-5 h-5 shrink-0"></i>
        <span class="md:hidden">历史记录</span>
      </a>
      <a href="#" class="sidebar-item flex items-center gap-3 px-3 py-3 rounded-xl text-sm tracking-tight text-white/60">
        <i data-lucide="trophy" class="w-5 h-5 shrink-0"></i>
        <span class="md:hidden">排行榜</span>
      </a>
      <a href="#" class="sidebar-item flex items-center gap-3 px-3 py-3 rounded-xl text-sm tracking-tight text-white/60">

        <span class="md:hidden">个人中心</span>

    </nav>

    <!-- Bottom spacer -->
    <div class="h-6 shrink-0"></div>

  <!-- ========== MAIN CONTENT ========== -->

    <!-- Top Bar -->
    <header class="flex items-center px-6 py-4 md:px-10 md:py-5 fade-in">
      <!-- Mobile hamburger -->

        <i data-lucide="menu" class="w-5 h-5" style="color: var(--ts-charcoal);"></i>
      </button>

      <!-- Greeting (desktop only) -->
      <div class="hidden md:block">
        <h1 class="text-lg font-semibold tracking-tight" style="color: var(--ts-charcoal);">海龟汤</h1>
      </div>
    </header>

    <!-- Scrollable Content -->
    <div class="flex-1 px-5 md:px-10 pb-10 overflow-y-auto">

      <!-- ===== NICKNAME BAR ===== -->
      <section class="fade-in">
        <div class="glass-card p-4 flex items-center gap-3">
          <div class="w-9 h-9 rounded-full shrink-0 flex items-center justify-center"

            <i data-lucide="user" class="w-4 h-4 text-white/80"></i>
          </div>

            <i data-lucide="play" class="w-5 h-5"></i>
            开始匹配
          </span>
        </button>
      </section>

      <!-- ===== STATS ROW ===== -->
      <section class="grid grid-cols-3 gap-3 md:gap-4 max-w-lg mx-auto fade-in fade-in-d2">

        <div class="glass-card p-4 flex flex-col items-center text-center">
          <p class="text-xs tracking-wide mb-1" style="color: var(--ts-muted);">今日场次</p>

        <!-- Stat: 胜率 -->

          <p id="statWinrate" class="text-2xl font-bold tracking-tight" style="color: var(--ts-green);">—</p>
        </div>
        <!-- Stat: 连胜 -->
        <div class="glass-card p-4 flex flex-col items-center text-center">
          <p class="text-xs tracking-wide mb-1" style="color: var(--ts-muted);">连胜</p>
          <p id="statStreak" class="text-2xl font-bold tracking-tight" style="color: var(--ts-amber);">—</p>
        </div>
      </section>

    </div><!-- end scrollable content -->

  </div><!-- end main content wrapper -->

  <!-- ========== MATCHING OVERLAY ========== -->
  <div id="matchingOverlay" class="fixed inset-0 z-[60] hidden items-center justify-center" style="background: rgba(245,240,235,0.85); backdrop-filter: blur(12px);">
    <div class="glass-card p-8 max-w-sm w-full mx-4 text-center">
      <div class="w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4"
           style="background: linear-gradient(135deg, var(--ts-purple), var(--ts-pink));">

      </div>
      <button id="cancelMatchBtn" class="text-xs tracking-wide px-4 py-2 rounded-xl transition-all hover:scale-105"

      </button>

  <!-- ========== BOT PROMPT MODAL ========== -->
  <div id="botPromptModal" class="fixed inset-0 z-[70] hidden items-center justify-center" style="background: rgba(61,56,53,0.4); backdrop-filter: blur(8px);">
    <div class="glass-card p-8 max-w-sm w-full mx-4 text-center">
      <div class="w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4"

        <i data-lucide="bot" class="w-8 h-8 text-white"></i>

      <h3 class="text-lg font-semibold tracking-tight mb-2" style="color: var(--ts-charcoal);">是否接受 AI 机器人补位？</h3>

          接受 AI
        </button>
      </div>
    </div>

<script>
  // Initialize Lucide icons
  lucide.createIcons();

  // Mobile sidebar toggle
  (function() {
    const menuBtn  = document.getElementById('menuBtn');
    const drawer   = document.getElementById('sidebarDrawer');
    const overlay  = document.getElementById('sidebarOverlay');
    function openDrawer()  { drawer.classList.add('open');  overlay.classList.add('open');  document.body.style.overflow = 'hidden'; }
    function closeDrawer() { drawer.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = ''; }
    if (menuBtn) menuBtn.addEventListener('click', openDrawer);
    if (overlay) overlay.addEventListener('click', closeDrawer);
  })();

  // 生产环境静默 console 输出，避免泄露
  if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    ['log','warn','error','debug'].forEach(function(m){ console[m] = function(){}; });
  }

  // ===== 主逻辑 =====
  const nicknameInput = document.getElementById('nicknameInput');
  const nicknameBtn   = document.getElementById('nicknameBtn');
  const startMatchBtn = document.getElementById('startMatchBtn');
  const startMatchText = document.getElementById('startMatchText');
  const matchingOverlay = document.getElementById('matchingOverlay');
  const matchingTitle = document.getElementById('matchingTitle');
  const matchingDesc = document.getElementById('matchingDesc');
  const matchingProgress = document.getElementById('matchingProgress');
  const cancelMatchBtn = document.getElementById('cancelMatchBtn');
  const botPromptModal = document.getElementById('botPromptModal');
  const acceptBotsBtn = document.getElementById('acceptBotsBtn');
  const declineBotsBtn = document.getElementById('declineBotsBtn');

  let isMatching = false;
  let matchingTimer = null;
  let progressValue = 10;

  // 回填已存昵称
  const savedInfo = Api.getUserInfo();
  if (savedInfo && savedInfo.nickname) {
    nicknameInput.value = savedInfo.nickname;
  }

  // 加载个人统计
  async function loadProfile() {
    if (!Api.getUserToken()) return;
    try {
      const profile = await Api.getProfile();
      document.getElementById('statToday').textContent = profile.todayGames || 0;
      document.getElementById('statWinrate').textContent = profile.totalGames > 0
        ? Math.round(profile.winRate * 100) + '%' : '—';
      document.getElementById('statStreak').textContent = profile.streak || 0;
    } catch (err) {
      console.warn('加载统计失败:', err.message);
    }
  }


  // 确认昵称
  async function confirmNickname() {
    const nickname = nicknameInput.value.trim();
    if (!nickname) {
      Helpers.toast('请输入昵称', 'warn');
      nicknameInput.focus();
      return;
    }
    nicknameBtn.disabled = true;
    nicknameBtn.textContent = '保存中…';
    try {
      const res = await Api.register(nickname);
      Api.setUserToken(res.token, { userId: res.userId, nickname: res.nickname });
      Helpers.toast('昵称已保存', 'success');
      loadProfile();
    } catch (err) {
      Helpers.toast('保存失败：' + err.message, 'error');
    } finally {
      nicknameBtn.disabled = false;
      nicknameBtn.textContent = '确认';
    }
  }
// 轮询版匹配流程
  let pollInterval = null;

  async function startMatch() {
    if (!Api.getUserToken()) {
      Helpers.toast('请先输入昵称并确认', 'warn');
      nicknameInput.focus();
      return;
    }
    if (isMatching) return;
    isMatching = true;
    progressValue = 10;
    startMatchBtn.disabled = true;
    startMatchText.innerHTML = '<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> 匹配中…';
    Helpers.refreshIcons();

    matchingOverlay.classList.remove('hidden');
    matchingOverlay.classList.add('flex');
    matchingTitle.textContent = '匹配中…';
    matchingDesc.textContent = '正在为你寻找对手';
    matchingProgress.style.width = '10%';

    matchingTimer = setInterval(() => {
      progressValue = Math.min(90, progressValue + Math.random() * 8);
      matchingProgress.style.width = progressValue + '%';
    }, 800);

    // 加入匹配队列
    try {
      await Api.request('POST', '/match/join', null, { user: true });
    } catch (err) {
      Helpers.toast('加入匹配失败: ' + err.message, 'error');
      cleanupMatch();
      return;
    }

    // 开始轮询
    pollInterval = setInterval(pollMatchStatus, 1000);
  }

  async function pollMatchStatus() {
    if (!isMatching) return;
    try {
      const data = await Api.request('GET', '/match/status', null, { user: true });
      if (data.status === 'waiting' || data.status === 'prompted') {
        matchingDesc.textContent = '已等待 ' + (data.waitedSec || 0) + ' 秒';
      }
      if (data.status === 'prompted' && !botPromptModal.classList.contains('flex')) {
        botPromptModal.classList.remove('hidden');
        botPromptModal.classList.add('flex');
      }
      if (data.status === 'matched') {
        cleanupMatch();
        Helpers.toast('匹配成功，进入对局', 'success');
        setTimeout(() => {
          location.href = './game-play?gameId=' + encodeURIComponent(data.gameId) + '&seat=' + (data.yourSeat || 0);
        }, 500);
      }
    } catch (err) {
      if (err.status === 401) {
        cleanupMatch();
        Helpers.toast('身份过期，请重新输入昵称', 'error');
      }
    }
  }

  function cleanupMatch() {
    isMatching = false;
    if (matchingTimer) { clearInterval(matchingTimer); matchingTimer = null; }
    if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
    matchingOverlay.classList.add('hidden');
    matchingOverlay.classList.remove('flex');
    botPromptModal.classList.add('hidden');
    botPromptModal.classList.remove('flex');
    startMatchBtn.disabled = false;
    startMatchText.innerHTML = '<i data-lucide="play" class="w-5 h-5"></i> 开始匹配';
    Helpers.refreshIcons();
  }

  async function cancelMatch() {
    try { await Api.request('POST', '/match/cancel', null, { user: true }); } catch (_) {}
    cleanupMatch();
  }

  // 事件绑定
  nicknameBtn.addEventListener('click', confirmNickname);
  nicknameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmNickname();
  });
  startMatchBtn.addEventListener('click', startMatch);
  cancelMatchBtn.addEventListener('click', cancelMatch);

  acceptBotsBtn.addEventListener('click', async () => {
    botPromptModal.classList.add('hidden');
    botPromptModal.classList.remove('flex');
    try {
      const data = await Api.request('POST', '/match/accept-bots', null, { user: true });
      if (data.status === 'matched') {
        cleanupMatch();
        Helpers.toast('匹配成功，进入对局', 'success');
        setTimeout(() => {
          location.href = './game-play?gameId=' + encodeURIComponent(data.gameId) + '&seat=' + (data.yourSeat || 0);
        }, 500);
      }
    } catch (err) {
      Helpers.toast('接受补位失败: ' + err.message, 'error');
    }
  });

  declineBotsBtn.addEventListener('click', async () => {
    botPromptModal.classList.add('hidden');
    botPromptModal.classList.remove('flex');
    try { await Api.request('POST', '/match/decline-bots', null, { user: true }); } catch (_) {}
  });
  // 初始加载
  loadProfile();
</script>
</body>
</html>
