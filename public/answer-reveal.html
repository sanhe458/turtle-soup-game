<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汤底揭晓 — 海龟汤</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script>window.API_BASE = "/soup/api";</script>
<script src="js/api.js?v=3"></script>
<style>
  body { background: #F5F0EB; color: #3D3835; font-family: system-ui; }
  .card { background: rgba(255,255,255,0.7); border-radius: 16px; padding: 20px; }
  .btn {
    display: inline-block; padding: 12px 32px; border-radius: 14px;
    font-size: 14px; font-weight: 600; text-align: center; cursor: pointer;
    transition: all 0.2s ease; border: none; text-decoration: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: #8B7DA8; color: #fff; }
  .btn-outline { background: rgba(255,255,255,0.6); color: #6B6560; border: 1.5px solid #E0D8D0; }
  .stat-num { font-size: 24px; font-weight: 700; color: #8B7DA8; }
  .stat-label { font-size: 12px; color: #A09890; margin-top: 2px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
  .winner-gold { border: 2px solid rgba(212,167,106,0.4); box-shadow: 0 4px 20px rgba(212,167,106,0.1); }
</style>
</head>
<body class="p-4 max-w-xl mx-auto min-h-screen">
  <div id="loading" class="flex flex-col items-center justify-center py-20">
    <div class="text-lg font-semibold">加载揭晓数据…</div>
    <div id="loadingMsg" class="text-sm text-gray-400 mt-2"></div>
  </div>

  <div id="reveal" class="hidden space-y-5 pb-8">
    <!-- 头部 -->
    <div class="text-center py-6">
      <div class="text-3xl font-bold">汤底揭晓！</div>
      <div id="revealSub" class="text-sm text-gray-400 mt-2"></div>
    </div>

    <!-- 胜者 -->
    <div id="winnerCard" class="card text-center hidden winner-gold">
      <span class="pill" style="background:rgba(212,167,106,0.14);color:#D4A76A;">推理之星</span>
      <div id="winnerAvatar" class="w-16 h-16 rounded-full mx-auto my-3 flex items-center justify-center text-xl font-bold text-white" style="background:#8B7DA8;"></div>
      <div id="winnerName" class="text-lg font-bold"></div>
      <div id="winnerDesc" class="text-xs text-gray-400 mt-1"></div>
    </div>

    <!-- 汤底 -->
    <div class="card">
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="scroll-text" class="w-5 h-5" style="color:#8B7DA8;"></i>
        <span class="font-bold">汤底（真相）</span>
      </div>
      <div id="truthText" class="text-sm leading-relaxed rounded-xl p-4" style="background:rgba(139,125,168,0.06);"></div>
      <div class="mt-4 pt-3 border-t" style="border-color:rgba(224,216,208,0.5);">
        <span class="text-xs text-gray-400">原始汤面：</span>
        <p id="scenarioText" class="text-xs italic mt-1" style="color:#6B6560;"></p>
      </div>
    </div>

    <!-- 玩家表现 -->
    <div>
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="users" class="w-4 h-4" style="color:#8B7DA8;"></i>
        <span class="font-semibold text-sm">玩家表现</span>
      </div>
      <div id="playersGrid" class="grid grid-cols-3 gap-2 sm:gap-3"></div>
    </div>

    <!-- 对局总结 -->
    <div class="card">
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="bar-chart-3" class="w-4 h-4" style="color:#8B7DA8;"></i>
        <span class="font-semibold text-sm">对局总结</span>
      </div>
      <div class="grid grid-cols-3 gap-3 text-center">
        <div><div id="sumRounds" class="stat-num">—</div><div class="stat-label">总轮数</div></div>
        <div><div id="sumDuration" class="stat-num">—</div><div class="stat-label">游戏时长</div></div>
        <div>
          <div id="sumPuzzle" class="text-sm font-bold" style="color:#3D3835;">—</div>
          <span id="sumDifficulty" class="pill" style="background:rgba(139,125,168,0.12);color:#8B7DA8;">—</span>
        </div>
      </div>
    </div>

    <!-- 按钮 -->
    <div class="flex gap-3 justify-center">
      <a href="./" class="btn btn-outline">返回大厅</a>
      <a href="./" class="btn btn-primary">再来一局</a>
    </div>
  </div>

<script>
lucide.createIcons();

(function(){
  var gameId = new URLSearchParams(location.search).get('gameId') || '';
  var userInfo = (window.Api && Api.getUserInfo()) || {};

  if (!gameId) {
    document.getElementById('loadingMsg').textContent = '缺少对局 ID';
    return;
  }

  function grad(n) {
    var p = ['#8B7DA8,#C4A6B0','#7BAE98,#B8AFCA','#D4A76A,#C4A6B0','#8B7DA8,#7BAE98','#C4A6B0,#E8D5DD'];
    var h = 0;
    for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
    return 'linear-gradient(135deg,' + p[h % p.length] + ')';
  }

  function stars(n) {
    var s = '';
    for (var i = 0; i < 5; i++) {
      s += '<svg class="lucide" width="14" height="14" viewBox="0 0 24 24" fill="'+(i<n?'#D4A76A':'none')+'" stroke="'+(i<n?'#D4A76A':'#E0D8D0')+'" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
    }
    return s;
  }

  function fmtDuration(sec) {
    if (!sec && sec !== 0) return '—';
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m ? m + '分' : '') + (s || m ? s + '秒' : '0秒');
  }

  function diffLabel(d) {
    return {easy:'简单',medium:'中等',hard:'困难'}[d] || d || '—';
  }

  function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function load() {
    try {
      var d = await Api.getReveal(gameId);
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('reveal').classList.remove('hidden');
      render(d);
    } catch (e) {
      document.getElementById('loadingMsg').textContent = '加载失败：' + (e.message || '网络错误');
    }
  }

  function render(d) {
    // 副标题
    var sub = document.getElementById('revealSub');
    if (sub) sub.textContent = 'AI 判断有人接近真相，答案已公布';

    // 胜者
    if (d.winner && d.winner.nickname) {
      var wc = document.getElementById('winnerCard');
      if (wc) wc.classList.remove('hidden');
      var wa = document.getElementById('winnerAvatar');
      if (wa) { wa.textContent = d.winner.nickname.charAt(0); wa.style.background = grad(d.winner.nickname); }
      var wn = document.getElementById('winnerName');
      if (wn) wn.textContent = d.winner.nickname;
      var wd = document.getElementById('winnerDesc');
      if (wd) wd.textContent = (userInfo.nickname === d.winner.nickname) ? '你是最接近真相的玩家！' : '本局最接近真相的玩家';
    }

    // 汤底
    var tt = document.getElementById('truthText');
    if (tt) tt.textContent = d.truth || '（无）';
    var sc = document.getElementById('scenarioText');
    if (sc) sc.textContent = '"' + (d.originalScenario || '') + '"';

    // 玩家
    var pg = document.getElementById('playersGrid');
    if (pg && d.playersStats) {
      pg.innerHTML = d.playersStats.map(function(p) {
        var isW = p.isWinner || (d.winner && d.winner.nickname === p.nickname);
        return '<div class="card text-center text-sm p-4'+(isW?' winner-gold':'')+'">'+
          '<div class="w-10 h-10 rounded-full mx-auto mb-2 flex items-center justify-center text-xs font-bold text-white" style="background:'+grad(p.nickname)+';">'+esc(p.nickname.charAt(0))+'</div>'+
          '<div class="font-medium text-xs">'+esc(p.nickname)+(p.isBot?' 🤖':'')+'</div>'+
          '<div class="text-xs text-gray-400 mt-0.5">提问 '+(p.questionsCount||0)+' 次</div>'+
          '<div class="flex justify-center gap-0.5 mt-1.5">'+stars(p.stars||0)+'</div>'+
          '</div>';
      }).join('');
    }

    // 总结
    var sr = document.getElementById('sumRounds');
    if (sr) sr.textContent = d.totalRounds || '—';
    var sd = document.getElementById('sumDuration');
    if (sd) sd.textContent = fmtDuration(d.duration);
    var sp = document.getElementById('sumPuzzle');
    if (sp) sp.textContent = d.puzzleTitle || '—';
    var sdf = document.getElementById('sumDifficulty');
    if (sdf) sdf.textContent = diffLabel(d.difficulty);

    lucide.createIcons();
  }

  load();
})();
</script>
</body>
</html>
