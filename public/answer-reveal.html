  --ts-amber:        #D4A76A;   /* warning / hint               */
  --ts-red-soft:     #D4908A;   /* wrong / reset                */

  --ts-background:          #F5F0EB;
  --ts-foreground:          #3D3835;
  --ts-card:                rgba(255, 255, 255, 0.72);
  --ts-card-foreground:    #3D3835;
  --ts-popover:             rgba(255, 255, 255, 0.88);
  --ts-popover-foreground:  #3D3835;
  --ts-primary:            #8B7DA8;

  --ts-border:              #E0D8D0;
  --ts-input:               #EDE8E3;

  /* — Radius — */
  --ts-radius-sm:   8px;
  --ts-radius-md:  16px;
  --ts-radius-lg:  24px;
  --ts-radius-xl:  32px;

  /* — Shadows — */
  --ts-shadow-sm:  0 2px 8px rgba(61, 56, 53, 0.06);
  --ts-shadow-md:  0 8px 32px rgba(61, 56, 53, 0.08);
  --ts-shadow-lg:  0 16px 48px rgba(61, 56, 53, 0.12);
  --ts-glow-purple: 0 0 40px rgba(139, 125, 168, 0.15);
  --ts-glow-pink:   0 0 40px rgba(196, 166, 176, 0.12);

  /* — Typography — */
  --ts-font-sans:  'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --ts-font-mono:  'SF Mono', 'Fira Code', monospace;

  /* — Transitions — */
  --ts-ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ts-duration:    320ms;
}

    <script>
      lucide.createIcons();

      // Mobile sidebar toggle
      (function() {
        const menuBtn  = document.getElementById('menuBtn');
        const sidebar  = document.getElementById('sidebar');
        const overlay  = document.getElementById('sidebar-overlay');

        if (!menuBtn || !sidebar || !overlay) return;

        function openDrawer()  {
          sidebar.classList.add('open');
          overlay.style.display = 'block';
          overlay.style.opacity = '1';
          overlay.style.pointerEvents = 'auto';
          document.body.style.overflow = 'hidden';
        }
        function closeDrawer() {
          sidebar.classList.remove('open');
          overlay.style.opacity = '0';
          overlay.style.pointerEvents = 'none';
          setTimeout(function() { overlay.style.display = ''; }, 320);
          document.body.style.overflow = '';
        }

        menuBtn.addEventListener('click', openDrawer);
        overlay.addEventListener('click', closeDrawer);

        window.addEventListener('resize', function() {
          if (window.innerWidth >= 768) closeDrawer();
        });
      })();

      // 生产环境静默 console 输出，避免泄露
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        ['log','warn','error','debug'].forEach(function(m){ console[m] = function(){}; });
      }

      // ===== 揭晓数据加载 =====
      (function() {
        const params = new URLSearchParams(location.search);
        const gameId = params.get('gameId') || '';
        const userInfo = (window.Api && Api.getUserInfo()) || {};

        function avatarText(nickname) {
          if (!nickname) return '?';
          // 取首字符（兼容中英文）
          return nickname.charAt(0);
        }

        function avatarGradient(seed) {
          const palettes = [
            'linear-gradient(135deg, #8B7DA8, #C4A6B0)',
            'linear-gradient(135deg, #C4A6B0, #E8D5DD)',
            'linear-gradient(135deg, #7BAE98, #B8AFCA)',
            'linear-gradient(135deg, #D4A76A, #C4A6B0)',
            'linear-gradient(135deg, #8B7DA8, #7BAE98)',
          ];
          let h = 0;
          for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
          return palettes[h % palettes.length];
        }

        function renderStars(count) {
          const n = Math.max(0, Math.min(5, count || 0));
          let html = '';
          for (let i = 0; i < n; i++) {
            html += '<i data-lucide="star" class="w-3.5 h-3.5 fill-[#D4A76A]" style="color:#D4A76A;"></i>';
          }
          for (let i = n; i < 5; i++) {
            html += '<i data-lucide="star" class="w-3.5 h-3.5" style="color:#E0D8D0;"></i>';
          }
          return html;
        }

        function renderPlayers(playersStats, winnerNickname) {
          const container = document.getElementById('players-stats');
          if (!container) return;
          if (!playersStats || playersStats.length === 0) {
            container.innerHTML = '<p class="text-sm" style="color:#A09890;">暂无玩家数据</p>';
            return;
          }
          container.innerHTML = playersStats.map(function(p) {
            const isWinner = p.isWinner || (winnerNickname && p.nickname === winnerNickname);
            const cardStyle = isWinner
              ? 'background: rgba(255,255,255,0.7); border: 1px solid rgba(212,167,106,0.3); box-shadow: 0 4px 16px rgba(212,167,106,0.1);'
              : 'background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 4px 16px rgba(61,56,53,0.06);';
            const winnerBadge = isWinner
              ? '<div class="absolute top-2 right-2"><span class="text-[10px] font-semibold px-2 py-0.5 rounded-full" style="background: rgba(212,167,106,0.15); color: #D4A76A;">推理之星</span></div>'
              : '';
            const botBadge = p.isBot
              ? '<span class="inline-block text-[10px] font-medium px-1.5 py-0.5 rounded-full ml-1" style="background: rgba(139,125,168,0.12); color: #8B7DA8;">AI</span>'
              : '';
            const relative = isWinner ? ' relative overflow-hidden' : '';
            return '<div class="backdrop-blur-xl rounded-2xl p-5 text-center transition-all duration-300 ease-out hover:scale-[1.02]' + relative + '" style="' + cardStyle + '">' +
              winnerBadge +
              '<div class="w-12 h-12 rounded-full mx-auto mb-3 flex items-center justify-center text-sm font-bold" style="background: ' + avatarGradient(p.nickname) + '; color: white;">' + Helpers.escape(avatarText(p.nickname)) + '</div>' +
              '<p class="text-sm font-semibold" style="color: #3D3835;">' + Helpers.escape(p.nickname) + botBadge + '</p>' +
              '<p class="text-xs mt-1" style="color: #A09890;">提问 ' + (p.questionsCount || 0) + ' 次</p>' +
              '<div class="flex items-center justify-center gap-0.5 mt-2.5">' + renderStars(p.stars) + '</div>' +
              '</div>';
          }).join('');
          Helpers.refreshIcons();
        }

        function renderWinner(data) {
          const winnerSection = document.getElementById('winner-section');
          const noWinnerSection = document.getElementById('no-winner-section');
          if (data.winner && data.winner.nickname) {
            if (winnerSection) winnerSection.style.display = '';
            if (noWinnerSection) noWinnerSection.style.display = 'none';
            const avatar = document.getElementById('winner-avatar');
            const name = document.getElementById('winner-name');
            const desc = document.getElementById('winner-desc');
            if (avatar) {
              avatar.textContent = avatarText(data.winner.nickname);
              avatar.style.background = avatarGradient(data.winner.nickname);
            }
            if (name) name.textContent = data.winner.nickname;
            if (desc) {
              const isMe = userInfo && userInfo.nickname === data.winner.nickname;
              desc.textContent = isMe ? '你是最接近真相的玩家！' : '本局最接近真相的玩家';
            }
          } else {
            if (winnerSection) winnerSection.style.display = 'none';
            if (noWinnerSection) noWinnerSection.style.display = '';
            const title = document.getElementById('reveal-title');
            const subtitle = document.getElementById('reveal-subtitle');
            if (title) title.textContent = '对局结束';
            if (subtitle) subtitle.textContent = '本轮无人接近真相';
          }
        }

        function renderSummary(data) {
          const rounds = document.getElementById('summary-rounds');
          const duration = document.getElementById('summary-duration');
          const puzzle = document.getElementById('summary-puzzle');
          const diff = document.getElementById('summary-difficulty');
          if (rounds) rounds.textContent = data.totalRounds || 0;
          if (duration) duration.textContent = Helpers.formatDuration(data.duration);
          if (puzzle) puzzle.textContent = data.puzzleTitle || '—';
          if (diff) {
            diff.textContent = Helpers.difficultyLabel(data.difficulty);
          }
        }

        function renderTruth(data) {
          const truth = document.getElementById('truth-text');
          const scenario = document.getElementById('original-scenario');
          if (truth) truth.textContent = data.truth || '（无）';
          if (scenario) scenario.textContent = '"' + (data.originalScenario || '') + '"';
        }

        async function loadReveal() {
          if (!gameId) {
            Helpers.toast('缺少对局 ID', 'error');
            return;
          }
          try {
            const data = await Api.getReveal(gameId);
            renderWinner(data);
            renderTruth(data);
            renderPlayers(data.playersStats, data.winner && data.winner.nickname);
            renderSummary(data);
          } catch (err) {
            console.error('[reveal] 加载失败:', err);
            Helpers.toast(err.message || '加载揭晓数据失败', 'error');
            const truth = document.getElementById('truth-text');
            if (truth) truth.textContent = '加载失败：' + (err.message || '未知错误');
          }
        }

        // 按钮事件
        const btnReplay = document.getElementById('btn-replay');
        const btnBack = document.getElementById('btn-back-hall');
        if (btnReplay) btnReplay.addEventListener('click', function() {
          location.href = '/';
        });
        if (btnBack) btnBack.addEventListener('click', function() {
          location.href = '/';
        });

        loadReveal();
      })();
    </script>
</body>
</html>
