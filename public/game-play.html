<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对局中 — 海龟汤</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script>window.API_BASE = "/soup/api";</script>
<script src="js/api.js?v=3"></script>
<style>
  body { background: #F5F0EB; color: #3D3835; font-family: system-ui; }
  .card { background: rgba(255,255,255,0.7); border-radius: 16px; padding: 20px; }
  /* 聊天框 */
  .chat-box { max-height: 360px; min-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .chat-bubble-me { background: rgba(139,125,168,0.12); color: #3D3835; max-width: 85%; padding: 12px 16px; border-radius: 16px 16px 4px 16px; font-size: 14px; line-height: 1.5; }
  .chat-bubble-other { background: rgba(255,255,255,0.85); color: #3D3835; max-width: 85%; padding: 12px 16px; border-radius: 16px 16px 16px 4px; font-size: 14px; line-height: 1.5; border: 1px solid rgba(224,216,208,0.5); }
  .chat-name { font-size: 11px; color: #A09890; }
  .chat-pill { font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 4px; }
  @keyframes slide-up { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .chat-msg { animation: slide-up 0.35s ease-out forwards; }
</style>
</head>
<body class="p-4 max-w-2xl mx-auto">
  <div id="loading" class="text-center py-20">
    <div class="text-lg font-semibold">正在加载对局…</div>
    <div class="text-sm text-gray-400 mt-2" id="loadingStatus">连接中…</div>
  </div>

  <div id="game" class="hidden">
    <!-- 汤面 -->
    <div class="card mb-4">
      <div class="flex items-start gap-3">
        <div class="flex-1">
          <p id="puzzleScenario" class="text-sm leading-relaxed" style="color:#6B6560;"></p>
        </div>
        <span id="puzzleDifficulty" class="shrink-0 text-xs px-2 py-0.5 rounded-full"></span>
      </div>
      <span id="puzzlePlayCount" class="text-xs text-gray-400 mt-2 block"></span>
    </div>

    <!-- 回合信息 -->
    <div class="flex items-center justify-between mb-4 text-sm">
      <span id="roundInfo">第 1 / 10 轮</span>
      <span id="turnInfo" class="font-medium"></span>
      <span id="timerInfo" class="text-gray-400"></span>
    </div>

    <!-- 玩家面板 -->
    <div id="playerPanels" class="flex gap-3 mb-4"></div>

    <!-- 聊天 -->
    <div class="card mb-4 overflow-hidden" style="padding:0;">
      <!-- 聊天头部 -->
      <div class="flex items-center gap-2 px-4 py-2.5" style="border-bottom:1px solid rgba(224,216,208,0.5);">
        <i data-lucide="messages-square" class="w-4 h-4" style="color:#8B7DA8;"></i>
        <span class="text-xs font-semibold" style="color:#6B6560;">问答区</span>
        <span id="chatHint" class="ml-auto text-[10px] font-medium px-2 py-0.5 rounded-full" style="background:rgba(160,152,144,0.12);color:#A09890;">等待开始</span>
      </div>
      <div id="chatBox" class="chat-box"></div>
    </div>

    <!-- AI 洞察 -->
    <div id="aiInsight" class="text-xs text-purple-600 mb-3 italic"></div>

    <!-- 输入 -->
    <div class="flex gap-2">
      <input id="questionInput" type="text" placeholder="请输入你的问题…" maxlength="200" disabled
             class="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 bg-white/70 text-sm">
      <button id="sendBtn" onclick="submitQuestion()" disabled
              class="px-6 py-2.5 text-white rounded-xl text-sm font-medium disabled:opacity-50"
              style="background:#8B7DA8;">
        提问
      </button>
    </div>
    <p class="text-xs text-gray-400 mt-2">只能提出「是」「不是」或「无关」可回答的问题</p>
  </div>

<script src="js/api.js?v=3"></script>
<script>
// ====== 判定映射 (icon + 颜色) ======
var J = {
  'yes':        { icon:'check-circle',      color:'#7BAE98', bg:'rgba(123,174,152,0.14)', label:'是' },
  'no':         { icon:'x-circle',          color:'#D4908A', bg:'rgba(212,144,138,0.14)', label:'不是' },
  'irrelevant': { icon:'minus-circle',      color:'#A09890', bg:'rgba(160,152,144,0.12)', label:'不相关' },
  'perhaps_yes':{ icon:'help-circle',       color:'#D4A76A', bg:'rgba(212,167,106,0.14)', label:'或许是' },
  'perhaps_no': { icon:'help-circle',       color:'#D4A76A', bg:'rgba(212,167,106,0.14)', label:'或许不是'},
  'ambivalent': { icon:'help-circle',       color:'#D4908A', bg:'rgba(212,144,138,0.14)', label:'是也不是'}
};

// ====== 游戏状态 ======
var game = { gameId:'', puzzle:null, players:[], yourSeat:null, isYourTurn:false,
             currentRound:0, currentSeat:-1, maxRounds:0, revealed:false, sending:false };
var expectedGameId = new URLSearchParams(location.search).get('gameId') || '';
var pollTimer = null;
var chatCount = 0;

function init() {
  if (!expectedGameId) { showError('缺少对局ID'); return; }
  if (!window.Api || !Api.getUserToken()) { showError('请先在匹配大厅输入昵称'); return; }
  pollGameState();
  pollTimer = setInterval(pollGameState, 1500);
}

async function pollGameState() {
  if (game.revealed || game.sending) return;
  setLoadingStatus('加载游戏数据…');
  try {
    var d = await Api.request('GET', '/game/' + expectedGameId + '/state', null, { user: true });
    if (!d) return;
    setLoadingStatus('');

    // 首次加载
    if (!game.puzzle) {
      game.gameId = d.gameId; game.yourSeat = d.yourSeat;
      game.maxRounds = d.maxRounds;
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      renderPuzzle(d.puzzle);
    }

    // 每轮都刷新
    game.currentRound = d.currentRound;
    game.currentSeat = d.currentSeat;
    game.isYourTurn = d.isYourTurn;
    game.players = d.players || [];

    document.getElementById('roundInfo').textContent = '第 ' + d.currentRound + ' / ' + game.maxRounds + ' 轮';
    updateTurn(d);
    renderPlayers();

    // 聊天增量
    var chat = d.chat || [];
    while (chatCount < chat.length) {
      try {
        renderChat(chat[chatCount++]);
      } catch(e) {
      }
    }

    // 计时器
    if (d.timerRemaining != null) {
      var m = Math.floor(d.timerRemaining/60), s = d.timerRemaining%60;
      document.getElementById('timerInfo').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    }

    // 结束
    if (d.status === 'revealed') {
      game.revealed = true;
      clearInterval(pollTimer);
      document.getElementById('turnInfo').textContent = '对局结束';
      setTimeout(function() { location.href = './answer-reveal?gameId=' + d.gameId; }, 1500);
    }
  } catch (err) {
    if (err.status === 404) { clearInterval(pollTimer); showError('对局已结束'); }
  }
}

function setLoadingStatus(msg) {
  var el = document.getElementById('loadingStatus');
  if (el) el.textContent = msg;
}

function showError(msg) {
  var el = document.getElementById('loadingStatus');
  if (el) el.textContent = '⚠ ' + msg;
}

function renderPuzzle(p) {
  document.getElementById('puzzleScenario').textContent = p.scenario;
  document.getElementById('puzzlePlayCount').textContent = (p.playCount||0) + ' 人玩过';
  var diff = document.getElementById('puzzleDifficulty');
  diff.textContent = {easy:'简单',medium:'中等',hard:'困难'}[p.difficulty] || p.difficulty;
  diff.style.background = {easy:'#7BAE9830',medium:'#D4A76A30',hard:'#D4908A30'}[p.difficulty]||'#eee';
  diff.style.color = {easy:'#5A8A70',medium:'#B08A50',hard:'#B07070'}[p.difficulty]||'#666';
}

function renderPlayers() {
  var html = '';
  for (var i = 0; i < game.players.length; i++) {
    var p = game.players[i];
    var isMe = (i === game.yourSeat);
    var isTurn = (game.currentSeat === i);
    var bg = isTurn ? '#8B7DA820' : 'transparent';
    var border = isTurn ? '2px solid #8B7DA8' : '1px solid #E0D8D0';
    html += '<div class="flex-1 card text-center text-sm" style="background:'+bg+';border:'+border+'">'+
      '<div class="font-medium">' + (isMe?'⭐':'') + p.nickname + (p.isBot?' 🤖':'') + '</div>'+
      '<div class="text-xs text-gray-400">提问 ' + (p.questionsAsked||0) + ' 次</div>'+
      '</div>';
  }
  document.getElementById('playerPanels').innerHTML = html;
}

function updateTurn(d) {
  var el = document.getElementById('turnInfo');
  var inp = document.getElementById('questionInput');
  var btn = document.getElementById('sendBtn');
  if (d.isYourTurn) {
    el.textContent = '你的回合，请提问';
    el.style.color = '#8B7DA8';
    inp.disabled = false; btn.disabled = false;
    inp.placeholder = '请输入你的问题…';
  } else {
    var cur = (game.players||[]).find(function(p){return p.seat===d.currentSeat;});
    el.textContent = (cur?cur.nickname:'') + ' 的回合';
    el.style.color = '#A09890';
    inp.disabled = true; btn.disabled = true;
    inp.placeholder = '等待中…';
  }
}

function e(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderChat(c) {
  var isMe = (c.seat === game.yourSeat);
  var j = J[c.judgment] || { icon:'circle', color:'#A09890', bg:'rgba(160,152,144,0.12)', label:c.judgment||'判定中' };
  var side = isMe ? 'items-end' : 'items-start';
  var bubble = isMe ? 'chat-bubble-me' : 'chat-bubble-other';
  var name = isMe ? '你' : e(c.nickname);

  var html = '<div class="chat-msg flex flex-col '+side+' gap-1">'+
    '<span class="chat-name">'+name+' · 第'+(c.round||'?')+'轮</span>'+
    '<div class="'+bubble+'">'+e(c.question)+'</div>'+
    '<div class="flex items-center gap-2">'+
      '<span class="chat-pill" style="background:'+j.bg+';color:'+j.color+';">'+
        '<i data-lucide="'+j.icon+'" class="w-3 h-3"></i>'+
        '系统回答：'+j.label+
      '</span>';

  if (c.closeHint) {
    html += '<span class="chat-pill" style="background:rgba(139,125,168,0.16);color:#8B7DA8;">'+
            '<i data-lucide="sparkles" class="w-3 h-3"></i>接近了!</span>';
  }

  html += '</div></div>';

  document.getElementById('chatBox').innerHTML += html;
  lucide.createIcons();
  document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
  document.getElementById('chatHint').textContent = (c.nickname||'') + ' 提问';
}

async function submitQuestion() {
  if (!game.isYourTurn || game.sending) return;
  var q = document.getElementById('questionInput').value.trim();
  if (!q) return;

  game.sending = true;
  document.getElementById('questionInput').value = '';
  document.getElementById('questionInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;

  try {
    var result = await Api.request('POST', '/game/' + expectedGameId + '/question', { question: q }, { user: true });
    chatCount = 0;
    document.getElementById('chatBox').innerHTML = '';
    game.sending = false;
    await pollGameState();
  } catch (err) {
    game.sending = false;
    if (game.isYourTurn) {
      document.getElementById('questionInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
    }
    alert('发送失败: ' + (err.message || '网络错误'));
  }
}

init();
</script>
</body>
</html>
